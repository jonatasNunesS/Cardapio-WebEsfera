name: cardapio-webesfera

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio_local
      POSTGRES_DB: cardapio
      SENHA_BANCO_MIGRACAO: ${SENHA_BANCO_MIGRACAO:-migracao_local}
      SENHA_BANCO_API: ${SENHA_BANCO_API:-api_local}
      SENHA_BANCO_WORKER: ${SENHA_BANCO_WORKER:-worker_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql
      - ./banco:/banco:ro
      - ./banco/inicializacao:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U cardapio -d cardapio']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine3.23
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migracoes:
    build:
      context: .
      target: migracoes
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    env_file: .env
    init: true
    ports:
      - '127.0.0.1:${PORTA_API:-3000}:${PORTA_API:-3000}'
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORTA_API}/saude/pronto || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    env_file: .env
    init: true
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  dados-postgres:
  dados-redis:
