<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Busca no cardápio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.92}
.ph{background-color:#E6DED5;background-image:repeating-linear-gradient(135deg,rgba(31,26,23,.07) 0 10px,transparent 10px 20px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input:focus{outline:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F4F0;color:#1F1A17;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="padding:16px 16px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #E3DBD2">
    <a href="Main.dc.html" aria-label="Voltar ao cardápio" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <label for="busca" class="sr">Buscar prato ou ingrediente</label>
    <div style="flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border:2px solid #1849A9;border-radius:12px;background:#FFFFFF">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C524B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="busca" type="search" value="{{termo}}" onChange="{{digitar}}" placeholder="Prato ou ingrediente" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:16px;color:#1F1A17">
      <sc-if value="{{temTermo}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{limpar}}" aria-label="Limpar busca" style="width:36px;height:36px;border:0;border-radius:999px;background:#EFE9E2;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1A17" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </sc-if>
    </div>
  </header>

  <main style="flex:1;overflow-y:auto;padding:12px 20px 32px;display:flex;flex-direction:column">
    <sc-if value="{{semTermo}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:14px;font-weight:600;color:#5C524B">Mais buscados aqui</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{sugestoes}}" as="s" hint-placeholder-count="4">
            <button type="button" onClick="{{s.usar}}" style="height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #8C8079;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;color:#1F1A17;cursor:pointer">{{s.nome}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{comResultado}}" hint-placeholder-val="{{ true }}">
      <span role="status" style="font-size:14px;color:#5C524B;padding:4px 0 8px">{{contagem}}</span>
      <sc-for list="{{resultados}}" as="r" hint-placeholder-count="2">
        <a href="Prato.dc.html" style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #E3DBD2">
          <div style="flex:1;display:flex;flex-direction:column;gap:4px">
            <span style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5C524B">{{r.categoria}}</span>
            <span style="font-weight:600;font-size:16px">{{r.nome}}</span>
            <span style="font-size:14px;color:#5C524B;line-height:1.4">{{r.descricao}}</span>
            <span style="font-weight:700;font-size:15px">{{r.preco}}</span>
          </div>
          <div class="ph" aria-hidden="true" style="width:80px;height:80px;border-radius:12px;flex:none"></div>
        </a>
      </sc-for>
    </sc-if>

    <sc-if value="{{semResultado}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding:40px 8px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center">
        <strong style="font-size:17px">Nada encontrado para “{{termo}}”</strong>
        <span style="font-size:15px;color:#5C524B;line-height:1.5">Tente outro nome ou um ingrediente, como “abóbora” ou “queijo”.</span>
        <a href="Main.dc.html" style="margin-top:8px;height:44px;padding:0 18px;border-radius:12px;border:1.5px solid #1F1A17;display:flex;align-items:center;font-weight:600;font-size:15px">Ver todas as categorias</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { termo: 'costela' };
  }
  renderVals() {
    const pratos = [
      { categoria: 'Principais', nome: 'Costela na brasa', descricao: 'Fogo de chão, mandioca crocante e vinagrete.', preco: 'R$ 89,00', busca: 'costela carne mandioca vinagrete' },
      { categoria: 'Massas', nome: 'Pappardelle de costela', descricao: 'Ragu de costela desfiada e parmesão.', preco: 'R$ 72,00', busca: 'costela massa parmesao queijo' },
      { categoria: 'Principais', nome: 'Picanha na brasa', descricao: 'Farofa de ovos e vinagrete.', preco: 'R$ 98,00', busca: 'picanha carne farofa ovo' },
      { categoria: 'Principais', nome: 'Risoto de abóbora assada', descricao: 'Queijo canastra e sálvia.', preco: 'R$ 64,00', busca: 'risoto abobora queijo vegetariano' },
      { categoria: 'Entradas', nome: 'Pão de fermentação natural', descricao: 'Manteiga de ervas e flor de sal.', preco: 'R$ 24,00', busca: 'pao manteiga vegetariano' },
    ];
    const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    const termo = this.state.termo;
    const n = normalizar(termo);
    const resultados = n ? pratos.filter((p) => normalizar(p.nome + ' ' + p.busca).includes(n)) : [];
    const sugestoes = ['costela', 'vegetariano', 'queijo', 'sobremesa'].map((nome) => ({ nome, usar: () => this.setState({ termo: nome }) }));
    return {
      termo,
      temTermo: n.length > 0,
      semTermo: n.length === 0,
      comResultado: n.length > 0 && resultados.length > 0,
      semResultado: n.length > 0 && resultados.length === 0,
      resultados,
      contagem: resultados.length === 1 ? '1 prato encontrado' : resultados.length + ' pratos encontrados',
      sugestoes,
      digitar: (e) => this.setState({ termo: e.target.value }),
      limpar: () => this.setState({ termo: '' }),
    };
  }
}
</script>
</body>
</html>
